name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install isolated quick runtime
        run: python skills/light-probe/scripts/bootstrap.py
      - name: Install optional lock test dependency
        run: python -c "import os,subprocess; p='skills/light-probe/.venv/'+('Scripts/python.exe' if os.name=='nt' else 'bin/python'); subprocess.check_call([p,'-m','pip','install','filelock>=3.12,<5'])"
      - name: Tests and installed-skill smoke test
        run: python scripts/smoke.py
      - name: Portable ZIP
        run: python scripts/package.py
